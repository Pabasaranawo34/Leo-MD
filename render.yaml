services:
  - type: web
    name: leo-md
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: "10000"

      - key: GROQ_API_KEY
        sync: false

      - key: OPENAI_API_KEY
        sync: false